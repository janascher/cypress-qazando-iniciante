# nome da pipeline
name: Run Basic Tests - Scheduler

# em que momento será executada
on: 
  schedule:
    # recebe 5 parâmetros
    - cron: '20 19 13 08 *'

jobs:
  # o que vai ser feito nessa pipeline
  # só terei um job: rodar os testes
  run_tests:
    # máquina em que será executada
    runs-on: ubuntu-latest
    # passo a passo para rodar os testes
    steps:
      # clone do projeto
      - name: Checkout
        uses: actions/checkout@v4

      # instalação das dependências do projeto
      - name: Install dependencies
        run: npm install
      
      # execução e configuração do projeto
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          record: true
          # especificação do arquivo para rodar os testes
          spec: cypress/e2e/praticando
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      # upload do relatório do mocha
      - name: Upload an Individual File
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: cypress/reports/html
